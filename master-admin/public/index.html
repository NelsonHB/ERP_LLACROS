<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Master Admin · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/global.css" />
</head>
<body>
  <div class="scene">
    <div class="status" id="status-line">
      <span class="dot"></span>
      <span id="status-text">Verificando conexión…</span>
    </div>

    <div class="panel">
      <div class="logo-lg">M</div>
      <h1>Master Admin</h1>
      <p class="subtitle">Control central del ERP. Ingresa tus credenciales para continuar.</p>

      <form id="login-form">
        <div>
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" placeholder="tu@empresa.com" autocomplete="username" required />
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••••" autocomplete="current-password" required />
        </div>

        <div class="error" id="error-box"></div>

        <button type="submit" id="submit-btn">Entrar</button>
      </form>
    </div>

    <div class="footnote">Panel de administración del ERP</div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api/v1'

    const statusLine = document.getElementById('status-line')
    const statusText = document.getElementById('status-text')
    const form = document.getElementById('login-form')
    const errorBox = document.getElementById('error-box')
    const submitBtn = document.getElementById('submit-btn')

    if (localStorage.getItem('master_admin_token')) {
      window.location.href = '/dashboard.html'
    }

    async function checkStatus() {
      try {
        const res = await fetch(window.location.origin + '/health', { method: 'GET' })
        if (res.ok) {
          statusLine.className = 'status online'
          statusText.textContent = 'Conectado al servidor'
        } else {
          throw new Error('bad status')
        }
      } catch {
        statusLine.className = 'status offline'
        statusText.textContent = 'Sin conexión con el servidor'
      }
    }
    checkStatus()

    function showError(message) {
      errorBox.textContent = message
      errorBox.classList.add('visible')
    }

    function hideError() {
      errorBox.classList.remove('visible')
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      hideError()
      submitBtn.disabled = true
      submitBtn.textContent = 'Verificando…'

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        })

        const data = await res.json()

        if (!res.ok) {
          const message =
            data?.errors?.[0]?.message ||
            (res.status === 429
              ? 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'
              : 'Credenciales inválidas.')
          showError(message)
          return
        }

        localStorage.setItem('master_admin_token', data.data.token)
        localStorage.setItem('master_admin_user', JSON.stringify(data.data.user))
        window.location.href = '/dashboard.html'
      } catch (err) {
        showError('No se pudo contactar al servidor. Intenta de nuevo.')
      } finally {
        submitBtn.disabled = false
        submitBtn.textContent = 'Entrar'
      }
    })
  </script>
</body>
</html>
