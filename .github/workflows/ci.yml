name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  master-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./master-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: master-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  erp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: erp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
